name: "Request a Change"
description: "Request a change to this project."
projects: ["alboe-development/4"]
type: "Story"

body:
  - type: markdown
    attributes:
        value: "# Request"

  - type: markdown
    attributes:
      value: "_Share details about the change you need._"

  - type: textarea
    id: request
    attributes:
      label: "Request"
      description: "Describe the change you need."
      placeholder: "As a {role} of/for {context}, {request}."
    validations:
      required: true
