name: Pull Request Action
run-name: Pull Request Action - ${{ github.actor }}

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - syncrhonize
      - labeled

env:
  RID: ${{ github.run_id }}-${{ github.run_number }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Node
        uses: ./.github/actions/validate-change

  initialize:
    name: Initialize
    needs: [validate]
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize Node
        uses: ./.github/actions/initialize-node

  test-style:
    name: Test Style
    needs: [initialize]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize Node
        uses: ./.github/actions/initialize-node

      - name: Test Style
        shell: bash
        run: pnpm @all test:style
