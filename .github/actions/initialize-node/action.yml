name: Initialize Node
description: Prepare NodeJS and its dependencies.

runs:
  using: composite

  steps:
    - name: Install PNPM
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        cache: 'pnpm'
        node-version-file: '.nvmrc'

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
